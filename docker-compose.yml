services:
  db:
    image: postgres:16-alpine
    container_name: creatorsfy-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creatorsfy
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - creatorsfy-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creatorsfy-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - creatorsfy-network
    depends_on:
      db:
        condition: service_healthy
    command: yarn start:dev

volumes:
  postgres-data:

networks:
  creatorsfy-network:
    driver: bridge
